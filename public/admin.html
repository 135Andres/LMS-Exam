<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Panel — LMS Exams</title>
<script>
(function(){try{var t=localStorage.getItem('lmsTheme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<link rel="stylesheet" href="css/welcome.css">
<style>
  body{background:var(--bg-page);color:var(--text-primary);font-family:Inter,system-ui,sans-serif;margin:0;padding:0;overflow:auto;height:auto}
  .dev-panel{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
  .dev-panel h1{font-size:1.4rem;margin:0 0 1.5rem;color:var(--text-primary)}
  .dev-panel h1 span{color:var(--text-secondary);font-weight:400;font-size:.85rem;margin-left:.5rem}
  .breadcrumb{display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--text-secondary);margin-bottom:1.5rem;flex-wrap:wrap}
  .breadcrumb a{color:var(--accent);cursor:pointer;text-decoration:none}
  .breadcrumb a:hover{text-decoration:underline}
  .breadcrumb .sep{color:var(--text-tertiary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1rem}
  .card h2{font-size:1rem;margin:0 0 .75rem;color:var(--text-primary)}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;color:var(--text-secondary);font-weight:500;padding:.5rem .6rem;border-bottom:1px solid var(--border)}
  td{padding:.5rem .6rem;border-bottom:1px solid var(--border-subtle);vertical-align:top}
  tr:hover td{background:var(--surface-hover)}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:500}
  .badge-admin{background:var(--accent-dim);color:var(--accent)}
  .badge-user{background:var(--surface-hover);color:var(--text-secondary)}
  .badge-active{background:#10b98120;color:#10b981}
  .badge-archived{background:#f59e0b20;color:#f59e0b}
  .clickable{cursor:pointer;color:var(--accent);text-decoration:none}
  .clickable:hover{text-decoration:underline}
  .empty-state{color:var(--text-tertiary);font-style:italic;padding:1rem 0}
  .msg-list{max-height:500px;overflow-y:auto}
  .msg{padding:.5rem .75rem;border-left:3px solid var(--border);margin-bottom:.4rem;font-size:.8rem;border-radius:0 6px 6px 0;background:var(--surface)}
  .msg-user{border-left-color:var(--accent)}
  .msg-assistant{border-left-color:#10b981}
  .msg-system{border-left-color:#f59e0b}
  .msg-meta{font-size:.7rem;color:var(--text-tertiary);margin-bottom:.2rem}
  .msg-content{white-space:pre-wrap;word-break:break-word;max-height:120px;overflow-y:auto}
  .block-card{background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;margin-bottom:.5rem}
  .block-card h3{font-size:.85rem;margin:0 0 .3rem;color:var(--text-primary)}
  .block-card .meta{font-size:.7rem;color:var(--text-tertiary);margin-bottom:.3rem}
  .block-card pre{font-size:.75rem;white-space:pre-wrap;word-break:break-word;margin:0;color:var(--text-secondary)}
  .narrative-box{background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;padding:1rem;font-size:.8rem;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;color:var(--text-secondary)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem;margin-bottom:1rem}
  .stat-box{background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem}
  .stat-box .label{font-size:.7rem;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.03em}
  .stat-box .value{font-size:1.1rem;font-weight:600;color:var(--text-primary);margin-top:.15rem}
  .back-link{display:inline-flex;align-items:center;gap:.3rem;color:var(--accent);font-size:.8rem;cursor:pointer;text-decoration:none;margin-bottom:1rem}
  .back-link:hover{text-decoration:underline}
  #loading{color:var(--text-tertiary);padding:1rem 0}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1rem}
  .tab{padding:.5rem 1rem;font-size:.8rem;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:hover{color:var(--text-primary)}
  .hidden{display:none}
  .json-pre{font-size:.75rem;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;padding:.75rem;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;color:var(--text-secondary)}
</style>
</head>
<body>
<div class="dev-panel">
  <h1>Dev Panel <span>LMS Exams</span></h1>
  <div id="breadcrumb"></div>
  <div id="content"><div id="loading">Cargando...</div></div>
</div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
