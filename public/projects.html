<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyectos — LMS Exams</title><link rel="stylesheet" href="css/welcome.css"><style>
body{margin:0;background:var(--bg-primary,#fff);color:var(--text-primary,#172033)}.projects{max-width:1050px;margin:0 auto;padding:32px}.projects-header{display:flex;justify-content:space-between;align-items:center;gap:16px}.project-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:28px}.project-list,.project-content{border:1px solid var(--border-color,#e2e8f0);border-radius:14px;padding:16px}.project-list button,.row button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer}.project-list button.active,.row button:hover{background:#eef2ff}.breadcrumbs{display:flex;gap:7px;align-items:center;color:#64748b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:20px}.row{border:1px solid #e2e8f0;border-radius:10px;padding:10px}.explorer{position:fixed;top:72px;right:28px;width:300px;max-height:70vh;overflow:auto;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 12px 35px #0002}.hidden{display:none}.new{background:#4f46e5;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}@media(max-width:700px){.project-layout{grid-template-columns:1fr}.projects{padding:18px}}</style></head><body><main class="projects"><header class="projects-header"><div><a href="chat.html">← Chat</a><h1>Proyectos</h1></div><button id="newProject" class="new">Nuevo proyecto</button></header><div class="project-layout"><aside class="project-list"><h3>Mis proyectos</h3><div id="projectList"></div></aside><section class="project-content"><div class="breadcrumbs" id="breadcrumbs"></div><button id="back" class="hidden">← Volver</button><h2 id="projectName">Selecciona un proyecto</h2><div id="contents" class="grid"></div></section></div></main><button id="explorerButton" class="new" style="position:fixed;right:28px;top:20px">Explorador</button><aside id="explorer" class="explorer hidden"><h3>Explorador</h3><div id="tree"></div></aside><script type="module" src="js/projects.js"></script></body></html>
